name: Build and Deploy Wasm

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Cubiomes
        run: |
          git clone https://github.com/Cubitect/cubiomes.git cubiomes

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      # コンパイル実行
      - name: Compile to Wasm
        run: |
          emcc wrapper.c cubiomes/*.c \
            -I cubiomes \
            -O3 \
            -s WASM=1 \
            -s EXPORTED_RUNTIME_METHODS='["cwrap", "ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o nether_engine.js

      # 公開用フォルダを作成してファイルをまとめる
      - name: Prepare Public Site
        run: |
          mkdir public
          cp index.html nether_engine.js nether_engine.wasm public/

      # GitHub Pagesに自動デプロイ
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
