<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft ネザーゲート 3D</title>
  <style>
    body {
      background-color: #121522;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
    }
    .status-box {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
    }
    #canvas-container {
      width: 100%;
      height: 320px;
      background: #090b14;
      border: 1px solid #334155;
      border-radius: 8px;
      position: relative;
      margin-bottom: 12px;
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      width: 80px;
      text-align: center;
    }
    button {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 確実に届いているか確認するためのテスト表示 -->
  <div style="background: #22c55e; color: #000; font-weight: bold; padding: 8px; text-align: center; border-radius: 6px; margin-bottom: 10px;">
    🟢 HTMLロード成功（画面が表示されています）
  </div>

  <!-- ステータス表示 -->
  <div class="status-box" id="statusBox">
    ⏳ Wasmエンジンを読み込んでいます...
  </div>

  <!-- 3Dキャンバス -->
  <div id="canvas-container">
    <canvas id="viewCanvas"></canvas>
    <div id="canvasInfo" style="position:absolute; top:8px; right:8px; font-size:0.7rem; color:#94a3b8;">待機中</div>
  </div>

  <!-- 入力フォーム -->
  <div class="card">
    <div style="font-weight:bold; margin-bottom:6px;">座標入力 (現世)</div>
    <div style="display:flex; gap:6px;">
      X: <input type="number" id="owX" value="80">
      Y: <input type="number" id="owY" value="85">
      Z: <input type="number" id="owZ" value="80">
    </div>
    <div style="margin-top:8px;">
      SEED: <input type="number" id="seedInput" value="12345" style="width:120px;">
      <button onclick="runCalculation()">計算実行</button>
    </div>
  </div>

  <!-- 【重要】画面（HTML）を描画しきった「一番最後」にスクリプトを実行 -->
  <script>
    let isWasmReady = false;
    let scanNetherFunc = null;
    let wasmBuffer = null;

    var Module = {
      onRuntimeInitialized: function() {
        console.log("Wasm initialized!");
        document.getElementById('statusBox').textContent = "✅ Wasmエンジン準備完了！";
        document.getElementById('statusBox').style.borderColor = "#22c55e";
        document.getElementById('statusBox').style.color = "#22c55e";

        try {
          scanNetherFunc = Module.cwrap('scan_nether_3d', 'number', ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number']);
          wasmBuffer = Module._malloc(3000 * 4);
          isWasmReady = true;
          runCalculation();
        } catch (e) {
          document.getElementById('statusBox').textContent = "🚨 関数バインド失敗: " + e.message;
        }
      },
      printErr: function(text) {
        console.error("Wasm:", text);
      }
    };

    // 簡易描画テスト
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');
    
    function drawTestGrid() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#334155';
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px sans-serif';
      ctx.fillText('3D描画エリア（指で操作可能）', 30, 45);
    }
    drawTestGrid();

    function runCalculation() {
      if (!isWasmReady || !scanNetherFunc) {
        alert("Wasm準備中...");
        return;
      }
      const seed = parseInt(document.getElementById('seedInput').value) || 0;
      const count = scanNetherFunc(seed, -32, 32, -32, 32, 4, 6, wasmBuffer, 3000);
      document.getElementById('canvasInfo').textContent = "検出ブロック: " + count + "個";

      // 画面にブロックを描画
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(canvas.width / 2 - 10, canvas.height / 2 - 10, 20, 20);
      ctx.fillStyle = '#fff';
      ctx.fillText("計算成功: " + count + " blocks", 30, 80);
    }
  </script>

  <!-- Wasm読み込みスクリプト -->
  <script src="nether_engine.js"></script>

</body>
</html>
