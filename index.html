<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minecraft ネザーゲート混線3D (Wasm搭載版)</title>
  <style>
    :root {
      --bg: #07080d;
      --card-bg: #121522;
      --border: #262a3d;
      --accent: #a855f7;
      --cyan: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #facc15;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 3D透視キャンバス（上部54%） */
    #canvas-container {
      position: relative;
      width: 100%;
      height: 54%;
      background: radial-gradient(circle at center, #1a142e 0%, #06070c 100%);
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .btn-reset {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(18, 21, 34, 0.88);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.7rem;
      backdrop-filter: blur(6px);
      z-index: 5;
      cursor: pointer;
    }

    .canvas-info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.65rem;
      color: var(--text-dim);
      pointer-events: none;
      line-height: 1.4;
      text-align: right;
    }

    /* 下部：操作パネル */
    .controls-container {
      flex: 1;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .banner {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      border-left: 4px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
    }
    .banner.ok { border-left-color: var(--green); background: rgba(16, 185, 129, 0.12); }
    .banner.danger { border-left-color: var(--red); background: rgba(239, 68, 68, 0.12); }
    .banner.warn { border-left-color: #f97316; background: rgba(249, 115, 22, 0.12); }
    .banner-title { font-weight: bold; font-size: 0.85rem; }
    .banner-desc { font-size: 0.72rem; color: var(--text-dim); line-height: 1.3; }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coord-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .coord-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
    }
    .coord-box label { font-size: 0.72rem; font-weight: bold; width: 14px; }
    .coord-box.x label { color: #f87171; }
    .coord-box.y label { color: #4ade80; }
    .coord-box.z label { color: #60a5fa; }
    .coord-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      text-align: right;
      outline: none;
    }

    .chunk-presets {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .btn-preset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-preset.active {
      background: var(--yellow);
      color: #000;
      font-weight: bold;
      border-color: var(--yellow);
    }

    .toggle-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .btn-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-toggle.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
  </style>
