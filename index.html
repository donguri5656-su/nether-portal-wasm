<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minecraft ネザーゲート 3D (公式BlendedNoise完全準拠)</title>
  <style>
    :root {
      --bg: #090b14;
      --card-bg: #121522;
      --border: #262a3d;
      --accent: #a855f7;
      --cyan: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #facc15;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #statusBox {
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 250px;
      background: radial-gradient(circle at center, #1a142e 0%, #06070c 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .btn-reset {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(18, 21, 34, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.65rem;
      cursor: pointer;
    }

    .canvas-info {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.65rem;
      color: var(--text-dim);
      pointer-events: none;
      line-height: 1.3;
      text-align: right;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    .coord-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .coord-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
    }
    .coord-box label { font-size: 0.72rem; font-weight: bold; width: 14px; }
    .coord-box.x label { color: #f87171; }
    .coord-box.y label { color: #4ade80; }
    .coord-box.z label { color: #60a5fa; }
    .coord-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      text-align: right;
      outline: none;
    }

    .chunk-presets {
      display: flex;
      gap: 6px;
    }
    .btn-preset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-preset.active {
      background: var(--yellow);
      color: #000;
      font-weight: bold;
      border-color: var(--yellow);
    }
  </style>

  <!-- Wasm 初期化（読み込み順の競合を完全防止） -->
  <script>
    let scanNetherFunc = null;
    let getBufferFunc = null;
    let getBiomeFunc = null;
    let isWasmReady = false;

    // 画面とWasmの両方が準備できた時だけ安全に実行する関数
    function tryInitialRun() {
      if (isWasmReady && window.updateAll) {
        window.updateAll();
      }
    }

    var Module = {
      onRuntimeInitialized: function() {
        console.log("Wasm Ready!");
        const statusBox = document.getElementById('statusBox');
        
        try {
          scanNetherFunc = Module.cwrap('scan_nether_3d', 'number', ['number', 'number', 'number', 'number', 'number', 'number', 'number']);
          getBufferFunc = Module.cwrap('get_block_buffer', 'number', []);
          getBiomeFunc = Module.cwrap('get_nether_biome', 'number', ['number', 'number', 'number', 'number']);

          isWasmReady = true;
          statusBox.textContent = "✅ 公式BlendedNoiseエンジン準備完了！";
          statusBox.style.borderColor = "#10b981";
          statusBox.style.color = "#10b981";

          // 安全に初回描画を実行
          tryInitialRun();
        } catch (e) {
          statusBox.textContent = "🚨 エラー: " + e.message;
          statusBox.style.borderColor = "#ef4444";
          statusBox.style.color = "#ef4444";
        }
      },
      printErr: function(text) {
        console.error("Wasm:", text);
      }
    };
  </script>
  <script src="nether_engine.js"></script>
</head>
<body>

  <div id="statusBox">⏳ 公式BlendedNoiseエンジン起動中...</div>

  <div id="canvas-container">
    <canvas id="viewCanvas"></canvas>
    <div class="canvas-info" id="canvasInfo">待機中</div>
    <button class="btn-reset" onclick="resetCamera()">🎯 リセット</button>
  </div>

  <div class="card" style="border-left: 3px solid var(--green);">
    <div class="card-title">
      <span style="color:#34d399;">🌲 現世ポータルの位置</span>
      <span id="targetCoordHint" style="color:var(--cyan); font-size:0.7rem;">ネザー対応: X:10 Y:85 Z:10</span>
    </div>
    <div class="coord-grid">
      <div class="coord-box x"><label>X</label><input type="number" id="owX" value="80" oninput="updateAll()"></div>
      <div class="coord-box y"><label>Y</label><input type="number" id="owY" value="85" oninput="updateAll()"></div>
      <div class="coord-box z"><label>Z</label><input type="number" id="owZ" value="80" oninput="updateAll()"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🌱 ワールドシード値</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:0.75rem; color:var(--text-dim);">SEED:</span>
      <input type="number" id="seedInput" value="12345" oninput="updateAll()" 
             style="background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:4px; color:#fff; padding:4px 8px; font-size:0.85rem; width:130px;">
    </div>
  </div>

  <div class="card" style="border-left: 3px solid var(--yellow);">
    <div class="card-title">
      <span style="color:var(--yellow);">🟨 描画チャンク範囲</span>
      <span id="chunkSizeLabel" style="font-weight:bold; color:#fff;">3 × 3 チャンク</span>
    </div>
    <div class="chunk-presets">
      <button class="btn-preset active" id="btnP3" onclick="setChunkCount(3)">3×3 (48bl)</button>
      <button class="btn-preset" id="btnP6" onclick="setChunkCount(6)">6×6 (96bl)</button>
      <button class="btn-preset" id="btnP10" onclick="setChunkCount(10)">10×10 (160bl)</button>
    </div>
  </div>

  <script>
    let chunkCount = 3;
    let yaw = 0.85;
    let pitch = 0.35;
    let zoom = 1.1;
    let panX = 0;
    let panY = 0;

    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function setChunkCount(val) {
      chunkCount = parseInt(val) || 3;
      document.getElementById('chunkSizeLabel').textContent = `${chunkCount} × ${chunkCount} チャンク`;
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      if (chunkCount === 3) document.getElementById('btnP3').classList.add('active');
      if (chunkCount === 6) document.getElementById('btnP6').classList.add('active');
      if (chunkCount === 10) document.getElementById('btnP10').classList.add('active');

      zoom = Math.max(0.25, 3.6 / (chunkCount * 1.1));
      updateAll();
    }

    function resetCamera() {
      yaw = 0.85;
      pitch = 0.35;
      zoom = Math.max(0.25, 3.6 / (chunkCount * 1.1));
      panX = 0;
      panY = 0;
      drawScene();
    }

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      drawScene();
    }
    window.addEventListener('resize', resizeCanvas);

    // タッチ操作
    let touchMode = 0;
    let startDist = 0;
    let startZoom = zoom;
    let lastTouchX = 0, lastTouchY = 0;
    let lastMidX = 0, lastMidY = 0;

    container.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchMode = 1;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        touchMode = 2;
        const t1 = e.touches[0], t2 = e.touches[1];
        startDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        startZoom = zoom;
        lastMidX = (t1.clientX + t2.clientX) / 2;
        lastMidY = (t1.clientY + t2.clientY) / 2;
      }
    });

    container.addEventListener('touchmove', e => {
      if (touchMode === 1 && e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;
        yaw += dx * 0.01;
        pitch = Math.max(-1.45, Math.min(1.45, pitch + dy * 0.01));
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        drawScene();
      } else if (touchMode === 2 && e.touches.length === 2) {
        const t1 = e.touches[0], t2 = e.touches[1];
        const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        if (startDist > 0) {
          zoom = Math.max(0.15, Math.min(4.5, startZoom * (currentDist / startDist)));
        }
        const midX = (t1.clientX + t2.clientX) / 2;
        const midY = (t1.clientY + t2.clientY) / 2;
        panX += (midX - lastMidX);
        panY += (midY - lastMidY);
        lastMidX = midX;
        lastMidY = midY;
        drawScene();
      }
    });

    container.addEventListener('touchend', () => touchMode = 0);

    // 3D ➔ 2D 投影
    function project(x, y, z, originX, originY, originZ, w, h) {
      const relX = (x - originX) * zoom;
      const relY = (y - originY) * zoom;
      const relZ = (z - originZ) * zoom;

      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

      const rotX = relX * cosY - relZ * sinY;
      const rotZ = relX * sinY + relZ * cosY;
      const rotY = relY * cosP - rotZ * sinP;
      const depth = relY * sinP + rotZ * cosP;

      const denom = Math.max(60, 260 + depth * 0.4);
      const scale = 260 / denom;

      return {
        x: (w / 2) + panX + rotX * scale,
        y: (h / 2) + panY - rotY * scale,
        depth: depth
      };
    }

    let calculatedData = null;

    // --- Wasm地形データ取得 ---
    function calculateData() {
      if (!isWasmReady || !scanNetherFunc || !getBufferFunc) return;

      const seed = parseInt(document.getElementById('seedInput').value) || 0;
      const owX = parseInt(document.getElementById('owX').value) || 0;
      const owY = parseInt(document.getElementById('owY').value) || 0;
      const owZ = parseInt(document.getElementById('owZ').value) || 0;

      const netherX = Math.floor(owX / 8);
      const netherY = owY;
      const netherZ = Math.floor(owZ / 8);

      document.getElementById('targetCoordHint').textContent = 
        `ネザー対応: X:${netherX} Y:${netherY} Z:${netherZ}`;

      const centerChunkX = Math.floor(netherX / 16);
      const centerChunkZ = Math.floor(netherZ / 16);

      const halfChunks = Math.floor(chunkCount / 2);
      const startChunkX = centerChunkX - halfChunks;
      const endChunkX = startChunkX + chunkCount;
      const startChunkZ = centerChunkZ - halfChunks;
      const endChunkZ = startChunkZ + chunkCount;

      const minX = startChunkX * 16;
      const maxX = endChunkX * 16;
      const minZ = startChunkZ * 16;
      const maxZ = endChunkZ * 16;

      const totalBlocks = chunkCount * 16;

      // チャンク範囲に応じた動的ステップ（バッファ上限あふれ防止）
      const stepH = Math.max(3, Math.round(totalBlocks / 20));
      const stepY = 6;

      const blockCount = scanNetherFunc(seed, minX, maxX, minZ, maxZ, stepH, stepY);
      const bufferPtr = getBufferFunc();
      const memoryView = new Uint8Array(Module.HEAPU8.buffer, bufferPtr, blockCount * 4);
      
      const blocks = [];
      for (let i = 0; i < blockCount; i++) {
        const idx = i * 4;
        blocks.push({
          x: minX + memoryView[idx + 0],
          y: memoryView[idx + 1],
          z: minZ + memoryView[idx + 2],
          type: memoryView[idx + 3]
        });
      }

      document.getElementById('canvasInfo').innerHTML = 
        `<span style="color:#facc15; font-weight:bold;">⚡ Wasm: ${blocks.length}bl</span><br>` +
        `${chunkCount}×${chunkCount}チャンク (${totalBlocks}×${totalBlocks}bl)`;

      calculatedData = {
        netherX, netherY, netherZ,
        centerChunkX, centerChunkZ,
        startChunkX, endChunkX, startChunkZ, endChunkZ,
        minX, maxX, minZ, maxZ, blocks, stepH
      };
    }

    function drawScene() {
      const rect = container.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);
      if (!calculatedData) return;

      const { netherX, netherY, netherZ, centerChunkX, centerChunkZ, startChunkX, endChunkX, startChunkZ, endChunkZ, minX, maxX, minZ, maxZ, blocks, stepH } = calculatedData;
      const floorY = 31;

      // 1. チャンク境界線
      for (let cx = startChunkX; cx < endChunkX; cx++) {
        for (let cz = startChunkZ; cz < endChunkZ; cz++) {
          const x0 = cx * 16, x1 = (cx + 1) * 16;
          const z0 = cz * 16, z1 = (cz + 1) * 16;
          const isCenter = (cx === centerChunkX && cz === centerChunkZ);

          ctx.strokeStyle = isCenter ? 'rgba(6, 182, 212, 0.85)' : 'rgba(250, 204, 21, 0.35)';
          ctx.lineWidth = isCenter ? 2 : 1;

          const p1 = project(x0, floorY, z0, netherX, netherY, netherZ, w, h);
          const p2 = project(x1, floorY, z0, netherX, netherY, netherZ, w, h);
          const p3 = project(x1, floorY, z1, netherX, netherY, netherZ, w, h);
          const p4 = project(x0, floorY, z1, netherX, netherY, netherZ, w, h);

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
          ctx.closePath();
          ctx.stroke();
        }
      }

      // 2. 溶岩海
      ctx.fillStyle = 'rgba(234, 88, 12, 0.16)';
      const lp1 = project(minX, floorY, minZ, netherX, netherY, netherZ, w, h);
      const lp2 = project(maxX, floorY, minZ, netherX, netherY, netherZ, w, h);
      const lp3 = project(maxX, floorY, maxZ, netherX, netherY, netherZ, w, h);
      const lp4 = project(minX, floorY, maxZ, netherX, netherY, netherZ, w, h);
      ctx.beginPath();
      ctx.moveTo(lp1.x, lp1.y); ctx.lineTo(lp2.x, lp2.y); ctx.lineTo(lp3.x, lp3.y); ctx.lineTo(lp4.x, lp4.y);
      ctx.closePath(); ctx.fill();

      // 3. Wasmブロック描画（本物の公式40層BlendedNoise地形）
      const renderList = blocks.map(b => ({
        ...b,
        proj: project(b.x, b.y, b.z, netherX, netherY, netherZ, w, h)
      }));
      renderList.sort((a, b) => b.proj.depth - a.proj.depth);

      renderList.forEach(b => {
        const s = Math.max(2.0, (stepH * 2.0) * (260 / Math.max(60, 260 + b.proj.depth * 0.4)) * (zoom * 0.9));
        ctx.fillStyle = 'rgba(125, 24, 38, 0.35)';
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.25)';
        ctx.fillRect(b.proj.x - s/2, b.proj.y - s/2, s, s);
        ctx.strokeRect(b.proj.x - s/2, b.proj.y - s/2, s, s);
      });

      // 4. 理想ポータル
      const idealProj = project(netherX, netherY, netherZ, netherX, netherY, netherZ, w, h);
      ctx.strokeStyle = '#06b6d4';
      ctx.fillStyle = 'rgba(6, 182, 212, 0.65)';
      ctx.lineWidth = 2;
      ctx.fillRect(idealProj.x - 6, idealProj.y - 12, 12, 18);
      ctx.strokeRect(idealProj.x - 6, idealProj.y - 12, 12, 18);
      ctx.fillStyle = '#06b6d4';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('理想位置', idealProj.x + 8, idealProj.y);
    }

    // グローバルに関数を公開
    window.updateAll = function() {
      calculateData();
      drawScene();
    };

    // 画面ロード完了時の安全な初期化
    window.addEventListener('load', () => {
      resizeCanvas();
      tryInitialRun();
    });
  </script>
</body>
</html>
