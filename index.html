<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft ネザーゲート 3D (Wasm版)</title>
  <style>
    :root {
      --bg: #090b14;
      --card-bg: #141724;
      --border: #282d42;
      --accent: #a855f7;
      --cyan: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #facc15;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ステータス＆エラーバー（最上部） */
    #statusBox {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
    }

    /* カードUI（入力欄） */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--cyan);
      display: flex;
      justify-content: space-between;
    }

    .coord-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .coord-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .coord-box label { font-size: 0.8rem; font-weight: bold; width: 16px; }
    .coord-box.x label { color: #f87171; }
    .coord-box.y label { color: #4ade80; }
    .coord-box.z label { color: #60a5fa; }
    .coord-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      text-align: right;
      outline: none;
    }

    /* 3Dキャンバス（入力欄の下に配置） */
    #canvas-container {
      position: relative;
      width: 100%;
      height: 320px;
      background: radial-gradient(circle at center, #1a142e 0%, #06070c 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .btn-reset {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(18, 21, 34, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .canvas-info {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.65rem;
      color: var(--text-dim);
      pointer-events: none;
      line-height: 1.4;
      text-align: right;
    }

    /* 診断バナー */
    .banner {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      border-left: 4px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
    }
    .banner.ok { border-left-color: var(--green); background: rgba(16, 185, 129, 0.12); }
    .banner.danger { border-left-color: var(--red); background: rgba(239, 68, 68, 0.12); }
    .banner.warn { border-left-color: #f97316; background: rgba(249, 115, 22, 0.12); }
    .banner-title { font-weight: bold; font-size: 0.85rem; margin-bottom: 2px; }
    .banner-desc { font-size: 0.75rem; color: var(--text-dim); line-height: 1.3; }

    .chunk-presets {
      display: flex;
      gap: 6px;
    }
    .btn-preset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-preset.active {
      background: var(--yellow);
      color: #000;
      font-weight: bold;
      border-color: var(--yellow);
    }
  </style>
</head>
<body>

  <!-- ① 最上部：ステータス＆診断モニター -->
  <div id="statusBox">⏳ Wasmエンジン読み込み中...</div>

  <!-- ② 最上部配置：現世ポータル座標 ＆ シード値入力欄（最初から絶対に見える！） -->
  <div class="card" style="border-left: 3px solid var(--green);">
    <div class="card-title">
      <span style="color:#34d399;">🌲 現世ポータルの位置</span>
      <span id="targetCoordHint" style="color:var(--cyan); font-size:0.75rem;">ネザー対応: X:10 Y:85 Z:10</span>
    </div>

      <div class="coord-box y"><label>Y</label><input type="number" id="owY" value="85" oninput="updateAll()"></div>
