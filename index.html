<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubiomes Wasm 診断テスト</title>
  <style>
    body {
      background: #0d0f17;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: #1a1d2e;
      border: 1px solid #313754;
      border-radius: 12px;
      padding: 16px;
      max-width: 400px;
      margin: 0 auto;
    }
    input {
      background: #0d0f17;
      border: 1px solid #4a5568;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      width: 80%;
      margin: 6px 0;
      text-align: center;
    }
    button {
      background: #a855f7;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 85%;
    }
    #result {
      margin-top: 16px;
      padding: 12px;
      background: #23273d;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: #4cc9f0;
    }
    /* スマホ画面でエラーを確認できるログエリア */
    #logBox {
      margin-top: 16px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border: 1px solid #333;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      text-align: left;
      color: #9ca3af;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>

  <!-- 【最上部で関数を完全定義：絶対に ReferenceError を起こさない設計】 -->
  <script>
    function addLog(msg) {
      console.log(msg);
      const box = document.getElementById('logBox');
      if (box) {
        box.innerHTML += "<div>" + msg + "</div>";
        box.scrollTop = box.scrollHeight;
      }
    }

    let getBiomeFunc = null;
    let isWasmLoaded = false;

    // ボタンの関数を一番最初に確実に定義
    window.checkBiome = function() {
      const resEl = document.getElementById('result');
      if (!isWasmLoaded || !getBiomeFunc) {
        resEl.textContent = "⏳ Wasmエンジンがまだロードされていません";
        resEl.style.color = "#f59e0b";
        return;
      }

      const seed = parseInt(document.getElementById('seed').value) || 0;
      const x = parseInt(document.getElementById('posX').value) || 0;
      const y = parseInt(document.getElementById('posY').value) || 0;
      const z = parseInt(document.getElementById('posZ').value) || 0;

      try {
        const biomeId = getBiomeFunc(seed, x, y, z);
        const biomeNames = {
          8: "🔥 ネザーの荒野", 178: "🍄 ソウルサンドの谷",
          179: "🌲 真紅の森", 180: "🌀 歪んだ森", 181: "⬛ 玄武岩デルタ"
        };
        const name = biomeNames[biomeId] || ("ID: " + biomeId);
        resEl.innerHTML = `判定成功: <span style="color:#facc15;">${name}</span>`;
        resEl.style.color = "#10b981";
      } catch (err) {
        resEl.textContent = "計算エラー: " + err.message;
        resEl.style.color = "#ef4444";
      }
    };

    // Emscripten の初期化フック
    var Module = {
      onRuntimeInitialized: function() {
        addLog("✅ Wasmの読み込みに成功しました！");
        getBiomeFunc = Module.cwrap('get_nether_biome', 'number', ['number', 'number', 'number', 'number']);
        isWasmLoaded = true;
        const resEl = document.getElementById('result');
        if (resEl) {
          resEl.textContent = "✅ Wasmエンジン準備完了！";
          resEl.style.color = "#10b981";
        }
      },
      printErr: function(text) {
        addLog("⚠️ Wasm警告: " + text);
      }
    };

    window.addEventListener('error', function(e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        addLog("🚨 読み込み失敗(404): " + (e.target.src || e.target.href));
      }
    }, true);
  </script>

  <!-- Wasm読み込み -->
  <script src="nether_engine.js"></script>
</head>
<body>

  <div class="card">
    <h3>🌌 ネザーWasm 診断テスト</h3>

    <div>
      <input type="number" id="seed" value="12345" placeholder="シード値">
    </div>
    <div style="display:flex; justify-content:center; gap:6px;">
      <input type="number" id="posX" value="0" style="width:25%;" placeholder="X">
      <input type="number" id="posY" value="64" style="width:25%;" placeholder="Y">
      <input type="number" id="posZ" value="0" style="width:25%;" placeholder="Z">
    </div>

    <button onclick="checkBiome()">Wasmで計算実行！</button>

    <div id="result">エンジン待機中...</div>

    <!-- スマホ画面でエラーがすぐわかるログ窓 -->
    <div id="logBox">
      <div>[ステータスログ]</div>
    </div>
  </div>

</body>
</html>
